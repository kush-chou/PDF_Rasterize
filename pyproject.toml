[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-processor-suite"
version = "1.0.0"
authors = [
  { name="Kush Chou", email="author@example.com" },
]
description = "A suite of tools to split, rasterize, and manage PDF files."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyPDF2",
    "PyQt6"
]

[project.scripts]
pdf-processor = "pdf_processor_suite.pdf_split_rasterize:main_cli"
pdf-processor-gui = "pdf_processor_suite.pdf_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]